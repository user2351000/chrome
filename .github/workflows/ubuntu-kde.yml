name: Ubuntu KDE

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Docker
        background: true
        run: |
          docker run -d \
            --network host \
            --add-host x:127.0.0.1 \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            ghcr.io/linuxserver/webtop:ubuntu-kde

      - name: Start GitHub-authenticated desktop proxy
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_ALLOWED_USER_ID: ${{ github.actor_id }}
        run: |
          node .github/scripts/github-auth-proxy.js > "$RUNNER_TEMP/github-auth-proxy.log" 2>&1 &
          proxy_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/github-auth-proxy.log" >&2
              exit 1
            fi
            sleep 1
          done
          echo "GitHub-authenticated desktop proxy did not start in time." >&2
          cat "$RUNNER_TEMP/github-auth-proxy.log" >&2
          exit 1

      - name: Desktop URL https://<random-subdomain>.trycloudflare.com (sign in with GitHub)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1
          cloudflared tunnel --url http://localhost:8080
