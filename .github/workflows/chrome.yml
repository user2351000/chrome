name: Chrome

on:
  workflow_dispatch:

concurrency:
  group: chrome-desktop-session
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find previous Chrome profile
        id: previous-profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHROME_STATE_ENCRYPTION_KEY: ${{ secrets.CHROME_STATE_ENCRYPTION_KEY }}
        run: node .github/scripts/chrome-state.js find

      - name: Download previous Chrome profile
        if: steps.previous-profile.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: chrome-profile-state
          path: ${{ runner.temp }}/chrome-profile-state-download
          run-id: ${{ steps.previous-profile.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Restore Chrome profile
        env:
          CHROME_STATE_ENCRYPTION_KEY: ${{ secrets.CHROME_STATE_ENCRYPTION_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/chrome-profile"
          encrypted="$RUNNER_TEMP/chrome-profile-state-download/chrome-profile-state.enc"
          if [ -f "$encrypted" ]; then
            node .github/scripts/chrome-state.js decrypt \
              "$encrypted" "$RUNNER_TEMP/chrome-profile-state.tar.gz"
            tar -xzf "$RUNNER_TEMP/chrome-profile-state.tar.gz" \
              --no-same-owner --no-same-permissions \
              -C "$RUNNER_TEMP/chrome-profile"
          else
            echo "No previous Chrome profile found; starting with an empty profile."
          fi

      - name: Start Docker
        id: start-chrome
        run: |
          docker run -d \
            --name chrome \
            --network host \
            --add-host x:127.0.0.1 \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            --volume "$RUNNER_TEMP/chrome-profile:/config" \
            -e PUID="$(id -u)" \
            -e PGID="$(id -g)" \
            -e CHROME_CLI=https://duckduckgo.com/ \
            ghcr.io/linuxserver/chrome

      - name: Desktop URL https://<random-subdomain>.trycloudflare.com / Stop with curl x or x/ in Address Bar
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1
          echo "<?php passthru('pkill cloudflared');" > index.php
          sudo nohup php -S 0.0.0.0:80 2>/dev/null &
          cloudflared tunnel --url http://localhost:3000

      - name: Save Chrome profile
        if: always() && steps.start-chrome.outcome == 'success'
        env:
          CHROME_STATE_ENCRYPTION_KEY: ${{ secrets.CHROME_STATE_ENCRYPTION_KEY }}
        run: |
          docker stop chrome
          tar -czf "$RUNNER_TEMP/chrome-profile-state.tar.gz" \
            -C "$RUNNER_TEMP/chrome-profile" .
          node .github/scripts/chrome-state.js encrypt \
            "$RUNNER_TEMP/chrome-profile-state.tar.gz" \
            "$RUNNER_TEMP/chrome-profile-state.enc"

      - name: Upload encrypted Chrome profile
        if: always() && steps.start-chrome.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-profile-state
          path: ${{ runner.temp }}/chrome-profile-state.enc
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
